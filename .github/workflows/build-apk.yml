name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, night-theme]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log || {
            grep -E "error:|warning:.*\.java|What went wrong|e: |FAILED|Exception|Caused by|\.java:[0-9]+|\.xml:[0-9]+|AAPT|Lint found" -A2 build.log | head -120 > err.txt
            echo "::error title=gradle::$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g' err.txt)"
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-launcher
          path: launcher/app/build/outputs/apk/release/app-release.apk
